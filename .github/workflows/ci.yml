name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  # trigger warm-ccache run

env:
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j$(nproc) 2>&1 | tee build.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          cat build.log
          while IFS= read -r line; do
            echo "::error title=Build::$line"
          done < build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Run tests
        if: success()
        run: |
          cd build && ctest --output-on-failure --timeout 60 -j$(nproc)

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv lcov
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake (Coverage)
        run: |
          cmake -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-O0 -g --coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-cov -j$(nproc) 2>&1 | tee build-cov.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          cat build-cov.log
          while IFS= read -r line; do
            echo "::error title=Coverage-Build::$line"
          done < build-cov.log

      - name: Upload coverage build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-cov-log
          path: build-cov.log

      - name: Run tests
        run: |
          cd build-cov && ctest --output-on-failure --timeout 60 -j$(nproc) || true
        continue-on-error: true

      - name: Capture coverage info
        continue-on-error: true
        run: |
          set -o pipefail
          lcov --capture --directory build-cov --output-file coverage.info \
            --rc branch_coverage=1 \
            --exclude '*/tests/*' \
            --exclude '*/build-cov/*' \
            --exclude '/usr/*' 2>&1 | tee lcov.log

      - name: Upload lcov log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-log
          path: lcov.log

      - name: Generate HTML report
        continue-on-error: true
        run: |
          genhtml coverage.info --output-directory coverage-report \
            --rc branch_coverage=1 \
            --title "cppload-pro Coverage"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.info
          fail_ci_if_error: false
          verbose: true

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake (ASan)
        env:
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=address
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-asan -j$(nproc) 2>&1 | tee build-asan.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          cat build-asan.log
          while IFS= read -r line; do
            echo "::error title=ASan-Build::$line"
          done < build-asan.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-asan-log
          path: build-asan.log

      - name: Run tests
        if: success()
        run: |
          cd build-asan && ctest --output-on-failure --timeout 60 -j$(nproc)

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=ON \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF

      - name: Build benchmarks
        run: |
          cmake --build build-bench -j$(nproc) 2>&1 | tee build-bench.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          cat build-bench.log
          while IFS= read -r line; do
            echo "::error title=Bench-Build::$line"
          done < build-bench.log

      - name: Run benchmarks
        run: |
          cd build-bench && ctest --output-on-failure --timeout 120 -R Bench -j$(nproc)

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build-bench/Testing/
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build-int -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=ON

      - name: Build integration tests
        run: |
          cmake --build build-int -j$(nproc) 2>&1 | tee build-int.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          cat build-int.log
          while IFS= read -r line; do
            echo "::error title=Int-Build::$line"
          done < build-int.log

      - name: Run integration tests
        run: |
          cd build-int && ctest --output-on-failure --timeout 30 -R Integration -j$(nproc)

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-13 clang-tidy-18 clang-tools-18 cmake ninja-build \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv

      - name: Install Python tools
        run: |
          pip3 install black flake8 pyyaml --break-system-packages

      - name: Check Python formatting
        run: |
          black --check python/ || echo "Warning: Python code not formatted"

      - name: Lint Python code
        run: |
          flake8 python/ --max-line-length=120 || echo "Warning: Flake8 issues found"

      - name: Validate YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('scenarios/ecommerce/load-test.yaml'))"

      - name: Generate compile_commands.json
        run: |
          cmake -B build-lint -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF

      - name: Run clang-tidy
        continue-on-error: true
        run: |
          set -o pipefail
          run-clang-tidy-18 -p build-lint -quiet -j$(nproc) \
            -header-filter='include/.*\.hpp$' \
            2>&1 | tee clang-tidy.log
          echo "clang-tidy completed (non-blocking)"

      - name: Upload clang-tidy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
