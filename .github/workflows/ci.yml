# @author ssrjkk | cppload
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  # trigger warm-ccache run

env:
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=ON \
            -DCPLOAD_BUILD_TOOLS=ON \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j$(nproc) 2>&1 | tee build.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build.log || true
          echo "=== FULL BUILD LOG ==="
          cat build.log
          echo "=== ANNOTATIONS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching)' build.log | while IFS= read -r line; do
            echo "::error title=Build::$line"
          done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Run tests
        if: success()
        run: |
          cd build && ctest --output-on-failure --timeout 120 -j$(nproc)

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv lcov
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake (Coverage)
        run: |
          cmake -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-O0 -g --coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=ON \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-cov -j$(nproc) 2>&1 | tee build-cov.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== COVERAGE BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build-cov.log || true
          echo "=== FULL BUILD LOG ==="
          cat build-cov.log
          echo "=== ANNOTATIONS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching)' build-cov.log | while IFS= read -r line; do
            echo "::error title=Coverage-Build::$line"
          done

      - name: Upload coverage build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-cov-log
          path: build-cov.log
          retention-days: 7

      - name: Run tests
        run: |
          cd build-cov && ctest --output-on-failure --timeout 60 -j$(nproc)

      - name: Capture coverage info
        continue-on-error: true
        run: |
          set -o pipefail
          lcov --capture --directory build-cov --output-file coverage.info \
            --rc branch_coverage=1 \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors negative \
            --exclude '*/tests/*' \
            --exclude '*/build-cov/*' \
            --exclude '/usr/*' 2>&1 | tee lcov.log

      - name: Upload lcov log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-log
          path: lcov.log
          retention-days: 7

      - name: Generate HTML report
        continue-on-error: true
        run: |
          genhtml coverage.info --output-directory coverage-report \
            --rc branch_coverage=1 \
            --ignore-errors empty \
            --title "cppload-pro Coverage"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.info
          fail_ci_if_error: false
          verbose: true

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake (ASan)
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_ENABLE_ASAN=ON \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-asan -j$(nproc) 2>&1 | tee build-asan.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== ASAN BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build-asan.log || true
          echo "=== FULL BUILD LOG ==="
          cat build-asan.log
          echo "=== ANNOTATIONS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching)' build-asan.log | while IFS= read -r line; do
            echo "::error title=ASan-Build::$line"
          done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-asan-log
          path: build-asan.log
          retention-days: 7

      - name: Run tests
        if: success()
        run: |
          cd build-asan && ctest --output-on-failure --timeout 300 -j$(nproc)

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake (TSan)
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_ENABLE_TSAN=ON \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-tsan -j$(nproc) 2>&1 | tee build-tsan.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== TSAN BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build-tsan.log || true
          echo "=== FULL BUILD LOG ==="
          cat build-tsan.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-tsan-log
          path: build-tsan.log
          retention-days: 7

      - name: Run tests
        if: success()
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          cd build-tsan && ctest --output-on-failure --timeout 300 -j$(nproc) -R "(Metrics|TokenBucket|IoContextPool|ProtocolFactory)"

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=ON \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build benchmarks
        run: |
          set -o pipefail
          cmake --build build-bench -j$(nproc) 2>&1 | tee build-bench.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== BENCHMARK BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build-bench.log || true
          echo "=== FULL BUILD LOG ==="
          cat build-bench.log
          echo "=== ANNOTATIONS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching)' build-bench.log | while IFS= read -r line; do
            echo "::error title=Bench-Build::$line"
          done

      - name: Run benchmarks
        run: |
          cd build-bench && ctest --output-on-failure --timeout 120 -R Bench -j$(nproc)

      - name: Run benchmarks (JSON, reproducible medians)
        run: |
          cd build-bench
          mkdir -p results
          # Benchmarks are built under tests/benchmarks/ (add_subdirectory
          # lives in tests/CMakeLists.txt), so resolve binaries from there.
          for t in token_bucket_bench metrics_bench url_bench sharded_collector_bench http_client_bench; do
            if [ -x "./tests/benchmarks/$t" ]; then
              ./tests/benchmarks/$t --benchmark_format=json --benchmark_repetitions=5 \
                --benchmark_display_aggregates_only=true > results/$t.json
            fi
          done
          python3 -c 'import json,glob; d=[]; [d.extend(json.load(open(f)).get("benchmarks", [])) for f in glob.glob("results/*.json")]; json.dump(d, open("results/current.json","w"))'

      - name: Compare against baseline (generates it on first run)
        id: bench
        run: |
          python3 scripts/benchmark_compare.py \
            --current build-bench/results/current.json \
            --baseline benchmarks/baseline.json \
            --tolerance 15 \
            --min-ns 500000 \
            --ignore-regex "(Parallel|Concurrent)" \
            || ( rc=$?; if [ "$rc" -eq 2 ]; then
              python3 scripts/benchmark_compare.py \
                --current build-bench/results/current.json \
                --save-baseline benchmarks/baseline.json
              echo "generated=1" >> "$GITHUB_OUTPUT"
              echo "::notice::Baseline generated — committing benchmarks/baseline.json"
            else
              exit "$rc"
            fi )

      - name: Commit generated baseline
        if: steps.bench.outputs.generated == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline.json
          git commit -m "chore(bench): update performance baseline [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      - name: Upload benchmark JSON results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-json
          path: build-bench/results/
          retention-days: 30

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: build-bench/Testing/
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure CMake
        run: |
          cmake -B build-int -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=ON \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build integration tests
        run: |
          cmake --build build-int -j$(nproc) 2>&1 | tee build-int.log
          ccache --show-stats

      - name: Show build errors
        if: failure()
        run: |
          echo "=== INTEGRATION BUILD ERRORS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching|note:)' build-int.log || true
          echo "=== FULL BUILD LOG ==="
          cat build-int.log
          echo "=== ANNOTATIONS ==="
          grep -iE '(FAILED|error:|undefined reference|fatal error|no matching)' build-int.log | while IFS= read -r line; do
            echo "::error title=Int-Build::$line"
          done

      - name: Run integration tests
        run: |
          cd build-int
          ctest --output-on-failure --timeout 30 -R Integration -V 2>&1 | tee test-int.log; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Integration tests FAILED (exit=$rc)"
            exit 1
          fi

      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-int-log
          path: build-int/test-int.log
          retention-days: 7

  smoke:
    name: E2E Smoke (demo services)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 ccache \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3 curl

      - name: Configure CMake (CLI only)
        run: |
          cmake -B build-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPLOAD_BUILD_TESTS=OFF \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=ON \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Build cppload-cli
        run: cmake --build build-smoke -j$(nproc)

      - name: Start demo services
        run: |
          PORT=8081 python3 services/orders/app.py &
          PORT=8082 python3 services/products/app.py &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:8082/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8081/health
          curl -fsS http://localhost:8082/health

      - name: Run e2e smoke (orders)
        run: |
          TARGET_URL=http://127.0.0.1:8081 SMOKE_PATH=/orders \
          ./build-smoke/tools/cppload-cli \
            --config=scenarios/smoke/load-test.yaml \
            --rps=200 --duration=5
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::smoke: orders service failed (exit=$rc)"
            exit 1
          fi
          echo "Cppload CLI exit=$rc (expected 0: SLA passed)"

      - name: Run e2e smoke (products)
        run: |
          TARGET_URL=http://127.0.0.1:8082 SMOKE_PATH=/products \
          ./build-smoke/tools/cppload-cli \
            --config=scenarios/smoke/load-test.yaml \
            --rps=200 --duration=5
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::smoke: products service failed (exit=$rc)"
            exit 1
          fi
          echo "Cppload CLI exit=$rc (expected 0: SLA passed)"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-13 clang-tidy-18 clang-tools-18 cmake ninja-build \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            python3-pip python3-venv curl

      - name: Install Python tools
        run: |
          pip3 install black flake8 pyyaml --break-system-packages

      - name: Check Python formatting
        run: |
          black --check python/

      - name: Lint Python code
        run: |
          flake8 python/ --max-line-length=120

      - name: Validate YAML
        run: |
          python3 -c "
          import yaml, sys, glob
          ok = True
          for f in glob.glob('scenarios/**/load-test.yaml', recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Lint Helm charts
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/kubernetes/helm/ --set image.tag=latest --set metrics.serviceMonitor.enabled=false
          helm template test-release deploy/kubernetes/helm/ --set image.tag=latest --set metrics.serviceMonitor.enabled=false > /dev/null
          echo "Helm lint passed"

      - name: Validate Dockerfile
        run: |
          set -e
          test -f deploy/docker/Dockerfile
          grep -q '^[^#]*FROM' deploy/docker/Dockerfile
          grep -q 'USER' deploy/docker/Dockerfile || echo "::warning::Dockerfile has no USER instruction"
          echo "Dockerfile validation passed"

      - name: Generate compile_commands.json
        run: |
          cmake -B build-lint -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCPLOAD_BUILD_TESTS=ON \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF \
            -DCPLOAD_BUILD_TOOLS=OFF \
            -DCPLOAD_BUILD_BENCHMARKS=OFF \
            -DCPLOAD_BUILD_INTEGRATION_TESTS=OFF \
            -DCPLOAD_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy
        id: clang-tidy
        continue-on-error: true
        run: |
          set -o pipefail
          run-clang-tidy-18 -p build-lint -quiet -j$(nproc) \
            -header-filter='include/.*\.hpp$' \
            2>&1 | tee clang-tidy.log
          echo "clang-tidy completed (non-blocking)"

      - name: Upload clang-tidy log
        if: steps.clang-tidy.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          retention-days: 7