name: Simple CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-all-dev libssl-dev

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}

      - name: Install C++ dependencies via Conan
        run: conan install . --output-folder=build-conan --build=missing -s build_type=Release

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build-conan/conan_toolchain.cmake \
            -DCPLOAD_BUILD_TESTS=OFF \
            -DCPLOAD_BUILD_PYTHON=OFF \
            -DCPLOAD_BUILD_WORKERS=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Python check
        run: |
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              name = os.path.basename(root)
              if root.count(os.sep) - root.replace('.','').count(os.sep) < 2:
                  print(f'{name}/')
          "
