name: Simple CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-all-dev libssl-dev
      
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build -j$(nproc)
      
      - name: Test
        run: cd build && ctest --output-on-failure || echo "Tests done"
      
      - name: Check Python
        run: |
          python3 -c "import yaml; print('YAML OK')"
          ls -la python/cppload/
