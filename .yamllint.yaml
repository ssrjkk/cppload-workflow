# @author ssrjkk | cppload
extends: default

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    check-keys: false
    allowed-values: ["true", "false", "yes", "no"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: true

ignore:
  - .git/
  - build/
  - build-*/
  - .opencode/
