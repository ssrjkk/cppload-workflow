global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'cppload-pro'
    static_configs:
      - targets: ['cppload-pro:9090']
    scrape_interval: 5s
  
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
  
  - job_name: 'product-service'
    static_configs:
      - targets: ['product-service:8080']
  
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8080']
