# @author ssrjkk | volley
{{ if .Values.config.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "volley.fullname" . }}-config
  labels:
    {{- include "volley.labels" . | nindent 4 }}
data:
  load-test.yaml: |
{{ .Values.config.scenario | default "{}" | indent 4 }}
  {{- if .Values.config.prometheus }}
  prometheus.yml: |
{{ .Values.config.prometheus | indent 4 }}
  {{- end }}
{{- end -}}