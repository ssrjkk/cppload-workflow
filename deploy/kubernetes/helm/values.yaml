# @author ssrjkk | cppload
# Default values for cppload-pro
# This is a YAML-formatted file.

replicaCount: 3

image:
  repository: ghcr.io/ssrjkk/cppload-pro
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Autoscaling (HPA)
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  targetRPSPerPod: 5000

# Worker configuration
worker:
  enabled: true
  replicaCount: 5
  
  resources:
    limits:
      cpu: "4"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "512Mi"
  
  loadTest:
    targetUrl: "http://target-service:8080"
    rps: 5000
    duration: "5m"
    scenario: "/etc/cppload/scenarios/ecommerce/load-test.yaml"

# Prometheus metrics
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s

# OpenTelemetry tracing
tracing:
  enabled: true
  otlpEndpoint: "http://jaeger-collector:4317"
  sampleRate: 0.1

# Service configuration
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cppload.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ServiceAccount
serviceAccount:
  create: true
  name: ""

# RBAC
rbac:
  create: true

# ConfigMap for scenarios
config:
  enabled: false
  scenario: {}

# Pod annotations
podAnnotations: {}

# Security context
podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

# Node selection
nodeSelector: {}
tolerations: []
affinity: {}

# Resource quota (limits total resource usage per namespace)
resourceQuota:
  enabled: false
  requestsCpu: "8"
  requestsMemory: "8Gi"
  limitsCpu: "16"
  limitsMemory: "16Gi"
  maxPods: 20
